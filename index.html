<body>

<div id="enterOverlay">
    <div class="enter-icon">▶</div>
    <p id="enterLabel">Click to Enter</p>
</div>

<div id="bg">
    <canvas id="stars"></canvas>
    <div class="wave"></div>
    <div class="wave"></div>
</div>
<div class="wrapper">
<div class="card">
<img class="pfp" src="/assets/images/gulp.jpeg">
<h1>Brunys</h1>
<div class="tag">
💻 Solo Front-End Developer
</div>
<div class="tag">
🍌 Banana
</div>
<p class="bio">
I am a frontend web developer. Creator of many projects. I also like to do youtube in my free time.
</p>
<div class="socials">
<a href="https://github.com/bjklfasd"><i class="fa-brands fa-github"></i> GitHub</a>
<a href="https://bunnies.lat/discord"><i class="fa-brands fa-discord"></i> Discord</a>
<a href="https://bunnies.lat"><i class="fa-solid fa-carrot"></i> Bunnies</a>
<a href="https://youtube.com/@brunys1"><i class="fa-brands fa-youtube"></i> YouTube</a>
</div>

<div class="player">
    <div class="player-track">
        <img class="cover" id="trackCover" src="" alt="">
        <div class="info">
            <div class="name" id="trackName">Track</div>
            <div class="artist" id="trackArtist">Artist</div>
        </div>
    </div>

    <div class="progress-row">
        <span id="curTime">0:00</span>
        <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0">
        <span id="durTime">0:00</span>
    </div>

    <div class="controls-row">
        <div class="buttons">
            <button id="prevBtn" title="Previous">⏮</button>
            <button id="playPauseBtn" class="play-pause" title="Play/Pause">▶</button>
            <button id="nextBtn" title="Next">⏭</button>
            <button id="replayBtn" title="Replay track">⟲</button>
        </div>
        <div class="volume-wrap">
            <span class="vol-icon">🔊</span>
            <input type="range" class="volume-bar" id="volumeBar" min="0" max="1" step="0.01" value="0.6">
        </div>
    </div>
</div>

</div>
</div>

<audio id="audio" preload="auto"></audio>

<script src="/s.js"></script>
